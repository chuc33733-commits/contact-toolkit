<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>腾讯文档证书下载器 · 在线版</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --brand:#2563eb; --brand-d:#1d4ed8; --ok:#059669;
    --warn:#b45309; --err:#dc2626; --soft:#eef2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;
    padding:20px 28px;box-shadow:0 2px 10px rgba(37,99,235,.25)}
  header h1{margin:0;font-size:20px;font-weight:600}
  header p{margin:4px 0 0;opacity:.85;font-size:12.5px}
  header a{color:#e0e7ff;text-decoration:none;font-size:12.5px}
  main{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.04)}
  .card h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card h2 .idx{background:var(--soft);color:var(--brand-d);width:22px;height:22px;
    border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 11px;
    font-size:13px;outline:none;background:#fff;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  textarea{resize:vertical;min-height:60px;font-family:inherit}
  .row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:760px){.row,.row3{grid-template-columns:1fr}}
  .checks{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:12px}
  .checks label{display:inline-flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:13px}
  .checks input{width:auto}
  button{border:0;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;
    cursor:pointer;transition:.15s}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-d)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:#f9fafb}
  .btn-danger{background:#fff;color:var(--err);border:1px solid #fecaca}
  .btn-danger:hover{background:#fef2f2}
  button:disabled{opacity:.5;cursor:not-allowed}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .muted{color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;
    border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:10px}
  th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:#f8fafc;font-weight:600;color:var(--muted);font-size:12px}
  tr:last-child td{border-bottom:0}
  .bar{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:12px 0 6px}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#4f46e5);transition:width .3s}
  #status-text{font-size:13px;color:var(--muted)}
  #logs{max-height:240px;overflow:auto;font-family:ui-monospace,Consolas,"Courier New",monospace;
    font-size:12px;background:#0f172a;color:#cbd5e1;border-radius:8px;padding:10px 12px;margin-top:10px;
    white-space:pre-wrap;word-break:break-all}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .hint code{background:#f3f4f6;padding:1px 5px;border-radius:4px}
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast{background:#111827;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;
    max-width:360px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .toast.ok{background:#065f46}.toast.err{background:#991b1b}.toast.warn{background:#92400e}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>腾讯文档证书下载器</h1>
  <p>从腾讯文档智能表格批量下载证书图片，按姓名 + 身份证号命名 · 文件只在服务器临时目录短暂存放，关页即清</p>
  <p><a id="back-home" href="/">← 返回主页</a></p>
</header>
<main>
  <section class="card">
    <h2><span class="idx">1</span>文档</h2>
    <label>腾讯文档链接或 ID</label>
    <input id="doc" placeholder="https://docs.qq.com/smartsheet/XXXX 或直接填文档 ID">
    <details style="margin-top:10px">
      <summary class="muted" style="cursor:pointer">私有文档需要登录态？填写 Cookie（仅存内存，不写日志）</summary>
      <textarea id="cookie" placeholder="从浏览器 F12 → Network 复制完整 Cookie，例如：uin=...; skey=..."></textarea>
    </details>
    <div class="actions">
      <button class="btn-primary" id="btn-sheets">获取子表</button>
      <span class="muted" id="doc-info"></span>
    </div>
    <label>子表</label>
    <select id="sheet"><option value="">（先点「获取子表」）</option></select>
  </section>

  <section class="card">
    <h2><span class="idx">2</span>字段</h2>
    <div class="actions">
      <button class="btn-ghost" id="btn-fields">解析字段</button>
      <span class="muted" id="fields-info"></span>
    </div>
    <div class="row3">
      <div><label>姓名字段</label><select id="name-field"></select></div>
      <div><label>身份证字段</label><select id="id-field"></select></div>
      <div><label>证书图片字段</label><select id="image-field"></select></div>
    </div>
  </section>

  <section class="card">
    <h2><span class="idx">3</span>命名与参数</h2>
    <div class="row">
      <div><label>命名预设</label><select id="preset"></select></div>
      <div><label>命名模板</label><input id="template" value="{name}{sep}{id}{seq_suffix}"></div>
    </div>
    <div class="row">
      <div><label>自定义前缀 {prefix}</label><input id="prefix" placeholder="可留空"></div>
      <div><label>分隔符 {sep}</label><input id="sep" placeholder="可留空，如 _ 或 -"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <div><label>附件范围</label><select id="kinds"></select></div>
      <div><label>产物形态</label><select id="bundle"></select></div>
    </div>
    <div class="hint" id="vars-hint"></div>
    <div class="actions">
      <button class="btn-ghost" id="btn-preview">预览命名</button>
      <span class="muted">预览使用示例数据，不会显示真实姓名 / 身份证号</span>
    </div>
    <div id="preview"></div>

    <div class="row3" style="margin-top:14px">
      <div><label>并发数（1-32）</label><input id="concurrency" type="number" value="8" min="1" max="32"></div>
      <div><label>超时（秒）</label><input id="timeout" type="number" value="60" min="5" max="600"></div>
      <div><label>重试次数</label><input id="retries" type="number" value="3" min="1" max="10"></div>
    </div>
    <div class="row3" style="margin-top:14px">
      <div><label>数量上限（调试用，留空=全部）</label><input id="limit" type="number" min="1" placeholder="全部"></div>
      <div><label>图片类型</label><select id="access">
        <option value="0">原图</option><option value="1">预览图（可能被压缩）</option></select></div>
      <div><label>报告格式</label><select id="report"></select></div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="overwrite"> 覆盖同名文件</label>
      <label><input type="checkbox" id="strict" checked> 严格校验身份证格式（跳过非法记录）</label>
    </div>
  </section>

  <section class="card">
    <h2><span class="idx">4</span>执行</h2>
    <div class="actions">
      <button class="btn-primary" id="btn-start">开始下载</button>
      <button class="btn-danger" id="btn-stop" disabled>停止</button>
      <button class="btn-ghost hidden" id="btn-zip">下载全部（ZIP）</button>
      <button class="btn-ghost hidden" id="btn-pdf">下载合并 PDF</button>
      <button class="btn-ghost hidden" id="btn-files">全部逐个下载</button>
      <button class="btn-ghost hidden" id="btn-extras">下载非图片附件（ZIP）</button>
      <button class="btn-ghost hidden" id="btn-report">仅下载报告</button>
    </div>
    <div class="bar"><div id="bar-fill"></div></div>
    <div id="status-text">尚未开始</div>
    <div id="filelist"></div>
    <div id="logs"></div>
  </section>
</main>

<div id="toasts"></div>
<script>
const BASE = (window.__BASE__ || '').replace(/\/+$/, '');
const state = { sid:null, token:null, polling:null, meta:null };
let currentFiles = [];   // files 形态的文件清单（供「全部逐个下载」复用）
document.getElementById('back-home').href = BASE + '/';

function toast(msg, kind='ok', ms=3600){
  const el=document.createElement('div');
  el.className='toast '+kind; el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), ms);
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function api(path, opts={}){
  const headers = opts.headers || {};
  if(state.sid){ headers['X-Session-Id']=state.sid; headers['X-Session-Token']=state.token; }
  const res = await fetch(BASE+path, {...opts, headers});
  if(res.status===401){ toast('会话已过期，正在重建…','warn'); await initSession(); throw new Error('session'); }
  return res;
}
async function apiJson(path, body){
  const res = await api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
  return res.json();
}
async function initSession(){
  const r = await fetch(BASE+'/api/session', {method:'POST'});
  const d = await r.json(); state.sid=d.sid; state.token=d.token;
}

function fillSelect(sel, items, valueKey, labelKey, keep){
  const cur = keep ? sel.value : '';
  sel.innerHTML = items.map(it=>`<option value="${esc(it[valueKey])}">${esc(it[labelKey])}</option>`).join('');
  if(cur){ const o=[...sel.options].find(o=>o.value===cur); if(o) sel.value=cur; }
}

async function loadMeta(){
  const d = await (await api('/api/cert/meta')).json();
  if(!d.ok){ toast('加载命名预设失败：'+(d.error||''),'err'); return; }
  state.meta = d;
  const psel = document.getElementById('preset');
  psel.innerHTML = d.presets.map(p=>`<option value="${esc(p.value)}">${esc(p.label)}</option>`).join('');
  psel.addEventListener('change', ()=>{ document.getElementById('template').value = psel.value; });
  document.getElementById('template').value = d.default_template || '{name}{sep}{id}{seq_suffix}';
  const rsel = document.getElementById('report');
  rsel.innerHTML = (d.report_formats||['csv']).map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');
  const ksel = document.getElementById('kinds');
  fillSelect(ksel, d.kinds||[], 'value', 'label');
  ksel.value = d.default_kinds || 'all';
  const bsel = document.getElementById('bundle');
  fillSelect(bsel, d.bundles||[], 'value', 'label');
  bsel.value = d.default_bundle || 'zip';
  document.getElementById('vars-hint').innerHTML =
    '可用变量：' + d.variables.map(v=>`<code>{${esc(v.name)}}</code>`).join(' ');
}

function readParams(){
  const limitRaw = document.getElementById('limit').value.trim();
  return {
    doc: document.getElementById('doc').value.trim(),
    cookie: document.getElementById('cookie').value.trim(),
    sheet: document.getElementById('sheet').value,
    name_field: document.getElementById('name-field').value || null,
    id_field: document.getElementById('id-field').value || null,
    image_field: document.getElementById('image-field').value || null,
    template: document.getElementById('template').value || '{name}{sep}{id}{seq_suffix}',
    prefix: document.getElementById('prefix').value,
    sep: document.getElementById('sep').value,
    limit: limitRaw ? parseInt(limitRaw,10) : null,
    file_kinds: document.getElementById('kinds').value || 'all',
    bundle: document.getElementById('bundle').value || 'zip',
  };
}

// ---- 1. 获取子表 ----
document.getElementById('btn-sheets').onclick = async ()=>{
  const doc=document.getElementById('doc').value.trim();
  const cookie=document.getElementById('cookie').value.trim();
  if(!doc){ toast('请先填写腾讯文档链接或 ID','warn'); return; }
  const btn=document.getElementById('btn-sheets'); btn.disabled=true; btn.textContent='读取中…';
  try{
    const d = await apiJson('/api/cert/sheets', {doc, cookie});
    if(!d.ok){ toast(d.error||'获取子表失败','err',6000); return; }
    fillSelect(document.getElementById('sheet'), d.sheets, 'id', 'name');
    document.getElementById('doc-info').textContent = '文档 ID：' + d.doc_id;
    toast('已获取 '+d.sheets.length+' 个子表');
  }catch(e){ if(e.message!=='session') toast('获取子表失败：'+e.message,'err'); }
  finally{ btn.disabled=false; btn.textContent='获取子表'; }
};

// ---- 2. 解析字段 ----
document.getElementById('btn-fields').onclick = async ()=>{
  const doc=document.getElementById('doc').value.trim();
  const cookie=document.getElementById('cookie').value.trim();
  const sheet=document.getElementById('sheet').value;
  if(!doc||!sheet){ toast('请先获取并选择子表','warn'); return; }
  const btn=document.getElementById('btn-fields'); btn.disabled=true; btn.textContent='解析中…';
  try{
    const d = await apiJson('/api/cert/fields', {doc, cookie, sheet});
    if(!d.ok){ toast(d.error||'解析字段失败','err',6000); return; }
    const opts = d.fields.map(f=>({title:f.title, label:f.is_attachment?f.title+'（附件）':f.title}));
    fillSelect(document.getElementById('name-field'), opts, 'title', 'label');
    fillSelect(document.getElementById('id-field'), opts, 'title', 'label');
    fillSelect(document.getElementById('image-field'), opts, 'title', 'label');
    if(d.defaults.name_field) document.getElementById('name-field').value = d.defaults.name_field;
    if(d.defaults.id_field) document.getElementById('id-field').value = d.defaults.id_field;
    if(d.defaults.image_field) document.getElementById('image-field').value = d.defaults.image_field;
    document.getElementById('fields-info').textContent = '记录数：' + d.records;
    toast('解析到 '+d.records+' 条记录');
  }catch(e){ if(e.message!=='session') toast('解析字段失败：'+e.message,'err'); }
  finally{ btn.disabled=false; btn.textContent='解析字段'; }
};

// ---- 3. 预览命名 ----
document.getElementById('btn-preview').onclick = async ()=>{
  const p = readParams();
  if(!p.doc||!p.sheet){ toast('请先获取并选择子表','warn'); return; }
  const btn=document.getElementById('btn-preview'); btn.disabled=true; btn.textContent='生成中…';
  const box=document.getElementById('preview');
  try{
    const d = await apiJson('/api/cert/preview', p);
    if(!d.ok){ box.innerHTML=''; toast(d.error||'预览失败','err',6000); return; }
    const rows = d.samples.map(s=>`<tr><td>${esc(s.index)}</td><td>${esc(s.filename)}</td><td class="muted">${esc(s.source_name)}</td></tr>`).join('');
    box.innerHTML = `<table><thead><tr><th>#</th><th>预览文件名（示例数据）</th><th>原始文件名</th></tr></thead><tbody>${rows}</tbody></table>`
      + `<div class="hint">共 ${d.total_jobs} 个任务，跳过 ${d.skipped} 条；仅展示前 ${d.samples.length} 条</div>`;
  }catch(e){ if(e.message!=='session') toast('预览失败：'+e.message,'err'); }
  finally{ btn.disabled=false; btn.textContent='预览命名'; }
};

// ---- 4. 执行 ----
function setRunning(running){
  document.getElementById('btn-start').disabled = running;
  document.getElementById('btn-stop').disabled = !running;
}
const ARTIFACT_BTNS = ['btn-zip','btn-pdf','btn-files','btn-extras'];
function renderProgress(d){
  const total = d.total||0, done = d.done||0;
  const pct = total ? Math.round(done*100/total) : (d.state==='running'?5:0);
  document.getElementById('bar-fill').style.width = pct + '%';
  let text = '';
  if(d.state==='idle') text = '尚未开始';
  else if(d.state==='running') text = `进行中 · ${d.phase||''} · ${done}/${total}（成功 ${d.ok||0}，失败 ${d.failed||0}，跳过 ${d.skipped||0}，取消 ${d.cancelled||0}）`;
  else if(d.state==='done') text = `完成 · 成功 ${d.ok||0}，跳过 ${d.skipped||0}，失败 ${d.failed||0}${d.result&&d.result.elapsed_sec?`，用时 ${d.result.elapsed_sec} 秒`:''}`;
  else if(d.state==='cancelled') text = `已停止 · 成功 ${d.ok||0}，取消 ${d.cancelled||0}，失败 ${d.failed||0}`;
  else if(d.state==='error') text = '失败：' + (d.error||'未知错误');
  document.getElementById('status-text').textContent = text;
  const logs = document.getElementById('logs');
  logs.textContent = (d.logs||[]).join('\n');
  logs.scrollTop = logs.scrollHeight;
  const finished = ['done','error','cancelled'].includes(d.state);
  const hasResult = d.state==='done' || d.state==='cancelled';
  const result = d.result || null;
  const bundle = (result && result.bundle) || 'zip';
  ARTIFACT_BTNS.forEach(id=>document.getElementById(id).classList.add('hidden'));
  if(hasResult && result){
    if(bundle==='files'){
      document.getElementById('btn-files').classList.remove('hidden');
    } else if(bundle==='pdf'){
      document.getElementById('btn-pdf').classList.remove('hidden');
      if(result.extras) document.getElementById('btn-extras').classList.remove('hidden');
    } else {
      document.getElementById('btn-zip').classList.remove('hidden');
    }
  }
  document.getElementById('btn-report').classList.toggle('hidden', d.state!=='done');
  return finished;
}
function stopPolling(){ if(state.polling){ clearInterval(state.polling); state.polling=null; } }

document.getElementById('btn-start').onclick = async ()=>{
  const p = readParams();
  if(!p.doc||!p.sheet){ toast('请先获取并选择子表','warn'); return; }
  const body = Object.assign({}, p, {
    concurrency: parseInt(document.getElementById('concurrency').value,10)||8,
    timeout: parseFloat(document.getElementById('timeout').value)||60,
    retries: parseInt(document.getElementById('retries').value,10)||3,
    access_type: parseInt(document.getElementById('access').value,10)||0,
    report_format: document.getElementById('report').value||'csv',
    overwrite: document.getElementById('overwrite').checked,
    strict_id: document.getElementById('strict').checked,
  });
  setRunning(true);
  ARTIFACT_BTNS.concat('btn-report').forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('filelist').innerHTML='';
  currentFiles = [];
  try{
    const d = await apiJson('/api/cert/start', body);
    if(!d.ok){ toast(d.error||'启动失败','err',6000); setRunning(false); return; }
    toast('已开始下载');
    stopPolling();
    state.polling = setInterval(pollProgress, 1000);
    pollProgress();
  }catch(e){ if(e.message!=='session') toast('启动失败：'+e.message,'err'); setRunning(false); }
};

async function pollProgress(){
  try{
    const d = await (await api('/api/cert/progress')).json();
    const finished = renderProgress(d);
    if(finished){
      stopPolling(); setRunning(false);
      if(d.state==='done'){
        toast('下载完成');
        const b = (d.result && d.result.bundle) || 'zip';
        if(b==='files') loadFileList();
      } else if(d.state==='error') toast('下载失败：'+(d.error||''),'err',6000);
    }
  }catch(e){ if(e.message!=='session'){ /* 网络抖动，继续轮询 */ } }
}

document.getElementById('btn-stop').onclick = async ()=>{
  document.getElementById('btn-stop').disabled = true;
  try{ await apiJson('/api/cert/stop', {}); toast('正在停止…','warn'); }
  catch(e){ if(e.message!=='session') toast('停止失败：'+e.message,'err'); }
};

async function blobDownload(path, fallbackName){
  const res = await api(path);
  const ctype = res.headers.get('Content-Type')||'';
  if(ctype.includes('application/json')){
    const d = await res.json(); toast(d.error||'下载失败','err',6000); return;
  }
  const blob = await res.blob();
  const disp = res.headers.get('Content-Disposition')||'';
  let name = fallbackName;
  const m = disp.match(/filename\*=UTF-8''([^;]+)/); if(m) name = decodeURIComponent(m[1]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('已开始下载 '+name);
}
document.getElementById('btn-zip').onclick = ()=>{ blobDownload('/api/cert/download','certificates.zip').catch(e=>{ if(e.message!=='session') toast('下载失败：'+e.message,'err'); }); };
document.getElementById('btn-pdf').onclick = ()=>{ blobDownload('/api/cert/download','certificates.pdf').catch(e=>{ if(e.message!=='session') toast('下载失败：'+e.message,'err'); }); };
document.getElementById('btn-extras').onclick = ()=>{ blobDownload('/api/cert/extras','cert_extras.zip').catch(e=>{ if(e.message!=='session') toast('下载失败：'+e.message,'err'); }); };
document.getElementById('btn-report').onclick = ()=>{
  const fmt = document.getElementById('report').value || 'csv';
  blobDownload('/api/cert/report?format='+encodeURIComponent(fmt), 'download_report.'+fmt)
    .catch(e=>{ if(e.message!=='session') toast('下载失败：'+e.message,'err'); });
};

// ---- files 形态：文件清单 + 逐个下载 ----
function downloadOne(name){
  return blobDownload('/api/cert/file?name='+encodeURIComponent(name), name)
    .catch(e=>{ if(e.message!=='session') toast('下载失败：'+e.message,'err'); });
}
function humanSize(n){
  if(n>=1048576) return (n/1048576).toFixed(2)+' MB';
  if(n>=1024) return (n/1024).toFixed(1)+' KB';
  return n+' B';
}
async function loadFileList(){
  const box = document.getElementById('filelist');
  box.innerHTML = '<div class="hint">正在加载文件清单…</div>';
  try{
    const d = await (await api('/api/cert/files')).json();
    if(!d.ok){ box.innerHTML=''; toast(d.error||'加载文件清单失败','err',6000); return; }
    currentFiles = d.items || [];
    if(!currentFiles.length){ box.innerHTML='<div class="hint">没有可下载的文件</div>'; return; }
    const rows = currentFiles.map(it=>{
      const tag = it.kind==='report' ? '报告' : (it.kind==='image' ? '图片' : '附件');
      return `<tr><td>${esc(it.name)}</td><td class="muted">${esc(tag)} · ${esc(humanSize(it.size))}</td>`
        + `<td><button class="btn-ghost" data-name="${esc(it.name)}">下载</button></td></tr>`;
    }).join('');
    box.innerHTML = `<div class="hint">共 ${currentFiles.length} 个文件（报告排在最后）</div>`
      + `<div style="max-height:360px;overflow:auto"><table><thead><tr><th>文件名</th><th>大小</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
    box.querySelectorAll('button[data-name]').forEach(b=>{
      b.onclick = ()=>downloadOne(b.getAttribute('data-name'));
    });
  }catch(e){ if(e.message!=='session'){ box.innerHTML=''; toast('加载文件清单失败：'+e.message,'err'); } }
}
document.getElementById('btn-files').onclick = async ()=>{
  if(!currentFiles.length) await loadFileList();
  if(!currentFiles.length){ toast('没有可下载的文件','warn'); return; }
  toast('浏览器可能询问是否允许下载多个文件，请选择允许','warn',5000);
  for(const it of currentFiles){
    await downloadOne(it.name);
    await new Promise(r=>setTimeout(r,300));
  }
};

window.addEventListener('pagehide', ()=>{
  if(state.sid) navigator.sendBeacon(BASE+'/api/session/close',
    new Blob([JSON.stringify({sid:state.sid})],{type:'application/json'}));
});
