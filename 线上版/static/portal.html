<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内网工具集</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --brand:#2563eb; --brand-d:#1d4ed8; --soft:#eef2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;
    padding:34px 28px 30px;box-shadow:0 2px 10px rgba(37,99,235,.25)}
  header h1{margin:0;font-size:24px;font-weight:600}
  header p{margin:6px 0 0;opacity:.85;font-size:13px}
  main{max-width:960px;margin:0 auto;padding:28px 18px 60px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:22px;box-shadow:0 1px 3px rgba(16,24,40,.04);display:flex;flex-direction:column;
    transition:.15s}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,24,40,.10)}
  .icon{font-size:34px;line-height:1}
  .card h2{margin:14px 0 6px;font-size:17px}
  .card p{margin:0 0 18px;color:var(--muted);font-size:13.5px;flex:1}
  a.enter{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;
    border-radius:9px;padding:10px 20px;font-size:14px;font-weight:600;text-align:center;
    transition:.15s}
  a.enter:hover{background:var(--brand-d)}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>内网工具集</h1>
  <p>家庭实验室 · VM102</p>
</header>
<main>
  <div class="grid">
    <section class="card">
      <div class="icon">📇</div>
      <h2>通讯录处理工具</h2>
      <p>VCF / Excel 导入、合并去重、导出通讯录</p>
      <a class="enter" id="go-contacts" href="/contacts">进入</a>
    </section>
    <section class="card">
      <div class="icon">📜</div>
      <h2>腾讯文档证书下载器</h2>
      <p>从腾讯文档智能表格批量下载证书图片，按姓名 + 身份证号命名</p>
      <a class="enter" id="go-cert" href="/cert">进入</a>
    </section>
  </div>
  <footer>文件只在服务器临时目录短暂存放，关页即清</footer>
</main>
<script>
  var BASE = (window.__BASE__ || '').replace(/\/+$/, '');
  document.getElementById('go-contacts').href = BASE + '/contacts';
  document.getElementById('go-cert').href = BASE + '/cert';
</script>
</body>
</html>
